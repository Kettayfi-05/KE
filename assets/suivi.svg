<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="600" height="400" fill="#FBF7F4"/>
  
  <!-- Browser Frame Wrapper -->
  <rect x="20" y="20" width="560" height="360" rx="12" fill="#E8D8CE" opacity="0.3" stroke="#3B2F2A" stroke-width="1.5"/>
  
  <!-- Browser Header Bar -->
  <line x1="20" y1="55" x2="580" y2="55" stroke="#3B2F2A" stroke-width="1.5"/>
  <!-- Browser Buttons -->
  <circle cx="45" cy="38" r="5" fill="#3B2F2A" opacity="0.8"/>
  <circle cx="60" cy="38" r="5" fill="#3B2F2A" opacity="0.5"/>
  <circle cx="75" cy="38" r="5" fill="#3B2F2A" opacity="0.3"/>
  <!-- Web URL Mock -->
  <rect x="110" y="28" width="380" height="20" rx="10" fill="#FBF7F4" opacity="0.8"/>
  <text x="300" y="42" font-family="'Inter', sans-serif" font-size="9" fill="#3B2F2A" opacity="0.7" text-anchor="middle" letter-spacing="1">internship.app/dashboard</text>

  <!-- Sidebar Mock -->
  <line x1="160" y1="55" x2="160" y2="380" stroke="#3B2F2A" stroke-width="1.5"/>
  <rect x="35" y="80" width="90" height="15" rx="4.5" fill="#3B2F2A" opacity="0.8"/>
  <rect x="35" y="115" width="90" height="8" rx="4" fill="#3B2F2A" opacity="0.3"/>
  <rect x="35" y="140" width="90" height="8" rx="4" fill="#3B2F2A" opacity="0.3"/>
  <rect x="35" y="165" width="90" height="8" rx="4" fill="#3B2F2A" opacity="0.3"/>
  <rect x="35" y="190" width="90" height="8" rx="4" fill="#3B2F2A" opacity="0.3"/>

  <!-- Main Content Grid -->
  <!-- Stats Card 1 (Trainees Tracked) -->
  <g transform="translate(185, 80)">
    <rect width="180" height="110" rx="8" fill="#B98F88" opacity="0.4" stroke="#3B2F2A" stroke-width="1.25"/>
    <text x="15" y="30" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#3B2F2A" letter-spacing="0.5">STAGIAIRES ACTIFS</text>
    <text x="15" y="75" font-family="'Cormorant Garamond', serif" font-size="42" font-weight="bold" fill="#3B2F2A">18</text>
    <rect x="15" y="90" width="100" height="4" rx="2" fill="#3B2F2A" opacity="0.2"/>
  </g>

  <!-- Stats Card 2 (EPI Allocations) -->
  <g transform="translate(380, 80)">
    <rect width="180" height="110" rx="8" fill="#FBF7F4" stroke="#3B2F2A" stroke-width="1.25"/>
    <text x="15" y="30" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#3B2F2A" letter-spacing="0.5">EPI DISTRIBUÉS</text>
    <text x="15" y="75" font-family="'Cormorant Garamond', serif" font-size="42" font-weight="bold" fill="#3B2F2A">94%</text>
    <path d="M 125 45 A 25 25 0 1 1 125 75 Z" fill="none" stroke="#3B2F2A" stroke-width="4" stroke-dasharray="80 30" transform="rotate(-90 125 60)"/>
  </g>

  <!-- Trainees Table / Row Grid Mock -->
  <g transform="translate(185, 210)">
    <rect width="375" height="150" rx="8" fill="#E8D8CE" opacity="0.2" stroke="#3B2F2A" stroke-width="1"/>
    
    <!-- Table Header -->
    <text x="15" y="25" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" fill="#3B2F2A" opacity="0.8">SUIVI DES EFFECTIFS &amp; SÉCURITÉ</text>
    <line x1="0" y1="35" x2="375" y2="35" stroke="#3B2F2A" stroke-width="1"/>

    <!-- Row 1 -->
    <circle cx="25" cy="55" r="10" fill="#B98F88"/>
    <rect x="45" y="51" width="120" height="8" rx="4" fill="#3B2F2A" opacity="0.7"/>
    <rect x="250" y="47" width="55" height="16" rx="8" fill="#3B2F2A"/>
    <text x="277" y="58" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#FBF7F4" text-anchor="middle">AFFECTÉ</text>
    <line x1="15" y1="75" x2="360" y2="75" stroke="#3B2F2A" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.5"/>

    <!-- Row 2 -->
    <circle cx="25" cy="95" r="10" fill="#FBF7F4" stroke="#3B2F2A" stroke-width="1"/>
    <rect x="45" y="91" width="90" height="8" rx="4" fill="#3B2F2A" opacity="0.7"/>
    <rect x="250" y="87" width="55" height="16" rx="8" fill="#B98F88" stroke="#3B2F2A" stroke-width="0.75"/>
    <text x="277" y="98" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#3B2F2A" text-anchor="middle">EN ATTENTE</text>
    <line x1="15" y1="115" x2="360" y2="115" stroke="#3B2F2A" stroke-width="0.5" stroke-dasharray="2 3" opacity="0.5"/>

    <!-- Row 3 -->
    <circle cx="25" cy="132" r="6" fill="#3B2F2A" opacity="0.2"/>
    <rect x="45" y="129" width="140" height="6" rx="3" fill="#3B2F2A" opacity="0.3"/>
  </g>
</svg>
